name: ponytail-sync

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rule copies match AGENTS.md
        run: node scripts/check-ponytail-sync.js
      - name: Tests
        run: node --test
