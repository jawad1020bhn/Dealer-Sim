name: ponytail-sync

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check skills/, link and rule copies
        run: node scripts/check-ponytail-sync.js
      - name: Script tests
        run: node --test
